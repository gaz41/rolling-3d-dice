<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-1.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>3D ROLLING DICE 1</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>3D ROLLING DICE</h1>
        <div class="clickText">click screen to roll dice</div>
      </header>

      <main>
        <div class="test">
          <div class="tray">
            <div class="die">
              <div class="cube">
                <div class="face"></div>
                <div class="face"></div>
                <div class="face"></div>
                <div class="face"></div>
                <div class="face"></div>
                <div class="face"></div>
              </div>
            </div>
            <div class="sum"></div>
            <!-- cloned die will go here -->
          </div>
        </div>
      </main>

      <!-- copyright info -->
      <footer>
        <div id="copy" class="copy"></div>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
